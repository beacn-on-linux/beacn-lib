[package]
name = "doom-async"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

beacn-lib = { path = "../..", features = ["tokio"] }
image = { version = "0.25.10", features = ["jpeg"] }
neurodoom = "0.6.7"

signal-hook = "0.4.4"

log = "0.4.33"
env_logger = "0.11.11"

