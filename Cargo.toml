[package]
name = "beacn-lib"
version = "0.1.11"
edition = "2024"

[features]
default = []

# These two get passed forward to nusb for use in async environments
tokio = ["dep:tokio", "nusb/tokio"]
smol = ["nusb/smol"]

[dependencies]
strum = { version = "0.28", features = ["strum_macros", "derive"] }
enum-map = "2.7"

byteorder = "1.5.0"

log = "0.4.33"
anyhow = "1"

nusb = "0.2"

async-trait = "0.1"
async-lock = "3.4"

oneshot = { version = "0.2", features = ["std", "async"] }

futures-lite = "2.6"

# Used for Managing Interaction threads
flume = "0.12"

# Used to verify Mix / Mix Create image data
jpeg-decoder = "0.3"

# Easier Error Handling
thiserror = "2.0"

# Tokio Spawner
tokio = { version = "1", optional = true, features = ["rt", "time"] }

# This replaces std::time in all environments
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# async-io include errno and polling, neither of which are wasm compatible, so we
# exclude it on wasm, and reimplement it with more appropriate crates
async-io = "2.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }


[dev-dependencies]
env_logger = "0.11.11"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
image = { version = "0.25", features = ["jpeg"] }

[[example]]
name = "enumerate"

[[example]]
name = "enumerate_async"
required-features = ["tokio"]

[[example]]
name = "hotplug"

[[example]]
name = "hotplug_async"
required-features = ["tokio"]

[[example]]
name = "audio"

[[example]]
name = "audio_async"
required-features = ["tokio"]

[[example]]
name = "controller"

[[example]]
name = "controller_async"
required-features = ["tokio"]